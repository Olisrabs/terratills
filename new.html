<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
  <title>Farm Investment Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Tailwind Configuration -->
  <script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: {
              DEFAULT: '#0F5338',
              50: '#F0F8F4',
              100: '#DBEFE5',
              700: '#0E4831',
              800: '#093B27',
              900: '#062619'
            },
            leaf: '#1E6F48',
            surface: '#F8FAFC'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          },
          borderRadius: {
            '3xl': '24px',
            '4xl': '32px'
          },
          boxShadow: {
            'card': '0 8px 24px -4px rgba(15, 83, 56, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04)',
            'nav': '0 -4px 20px rgba(0, 0, 0, 0.04)'
          }
        }
      }
    };
  </script>
  <!-- Custom Styles -->
  <style data-purpose="custom-layout">
    /* Hide scrollbars for clean horizontal slider display */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen py-0 md:py-8 font-sans antialiased select-none">
  <!-- BEGIN: MobileFrame -->
  <main
    class="w-full max-w-[390px] h-[844px] bg-[#F7F9F8] overflow-hidden flex flex-col relative rounded-none md:rounded-[44px] shadow-2xl border-0 md:border-[7px] md:border-slate-800">
    <!-- BEGIN: IOSStatusBar -->
    <header class="bg-forest pt-3 px-7 pb-1 flex justify-between items-center text-white z-20 shrink-0"
      data-purpose="status-bar">
      <span class="text-xs font-semibold tracking-tight">9:41</span>
      <div class="flex items-center space-x-1.5">
        <!-- Cellular Signal Icon -->
        <svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 16 16">
          <rect height="4" rx="0.5" width="2" x="1" y="11"></rect>
          <rect height="7" rx="0.5" width="2" x="5" y="8"></rect>
          <rect height="10" rx="0.5" width="2" x="9" y="5"></rect>
          <rect height="13" rx="0.5" width="2" x="13" y="2"></rect>
        </svg>
        <!-- Wifi Icon -->
        <svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 16 16">
          <path
            d="M8 12.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-3.5-3a5 5 0 0 1 7 0 .75.75 0 1 0 1.06-1.06 6.5 6.5 0 0 0-9.12 0 .75.75 0 1 0 1.06 1.06zm-2.5-3a8.5 8.5 0 0 1 12 0 .75.75 0 0 0 1.06-1.06 10 10 0 0 0-14.12 0 .75.75 0 1 0 1.06 1.06z">
          </path>
        </svg>
        <!-- Battery Icon -->
        <div class="w-5 h-2.5 border border-white rounded-[4px] p-0.5 flex items-center">
          <div class="h-full w-3 bg-white rounded-[1.5px]"></div>
        </div>
      </div>
    </header>
    <!-- END: IOSStatusBar -->
    <!-- Scrollable Body Content -->
    <div class="flex-1 overflow-y-auto no-scrollbar relative flex flex-col pb-20">
      <!-- BEGIN: HeroHeader -->
      <section class="bg-forest pt-3 pb-8 px-5 rounded-b-[36px] relative text-white" data-purpose="hero-header">
        <!-- User Greeting Row -->
        <div class="flex items-center justify-between mb-4">
          <div>
            <h1 class="text-xl font-bold tracking-tight">Hello, Good Morning</h1>
            <button class="flex items-center text-xs text-emerald-100/90 font-medium mt-0.5 hover:text-white transition"
              type="button">
              <span>Sunday, 01 Dec 2024</span>
              <svg class="w-3.5 h-3.5 ml-1 stroke-current" fill="none" stroke-width="2.5" viewbox="0 0 24 24">
                <path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>
          </div>
          <!-- Profile Avatar with Plant Badge -->
          <div class="relative cursor-pointer">
            <div
              class="w-10 h-10 rounded-full border-2 border-emerald-300/40 overflow-hidden bg-emerald-800 flex items-center justify-center">
              <img alt="Farmer User" class="w-full h-full object-cover"
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuDC8CpThACZQtq5DUL-hqNAp25i2Uu9yq_uEO5dwxBmX3lV8hcOv_W9pcUn5774l2g7l999i8jsodZBiCKOjn3CbJ6oyqgoFpk9YkLa38LmqOnUrsXfB9eQp6Pgic2rRJV527f7XCgYNmsXlEjaNx8F-mrUmJXdNnGDRFdWb-iW6D1DX90qLcIikJgY0uh39U9hrS7_to9mGC8CsipdHXumNlDoaJsD6wt9H6nJjeYY" />
            </div>
            <span
              class="absolute -bottom-0.5 -right-0.5 w-4 h-4 bg-emerald-400 border border-forest rounded-full flex items-center justify-center text-[10px]"
              title="Farmer Pro">
              🌿
            </span>
          </div>
        </div>
        <!-- Search Bar Input Pill -->
        <div class="relative flex items-center mt-3" data-purpose="search-box">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-emerald-200/80">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
              <circle cx="11" cy="11" r="7" stroke-linecap="round"></circle>
              <path d="M21 21l-4.35-4.35" stroke-linecap="round"></path>
            </svg>
          </div>
          <input
            class="w-full bg-[#1A6145] text-white placeholder-emerald-200/70 text-xs rounded-full pl-9 pr-9 py-2.5 border border-emerald-600/30 focus:outline-none focus:ring-2 focus:ring-emerald-300"
            placeholder="Search here..." type="text" />
          <button aria-label="Voice Search"
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-emerald-200/80 hover:text-white"
            type="button">
            <svg class="w-4 h-4" fill="currentColor" viewbox="0 0 20 20">
              <path clip-rule="evenodd"
                d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z"
                fill-rule="evenodd"></path>
            </svg>
          </button>
        </div>
      </section>
      <!-- END: HeroHeader -->
      
      <!-- BEGIN: InvestByCategory -->
      <section class="mt-4 px-4" data-purpose="categories-section">
        <h2 class="text-sm font-bold text-slate-900 mb-2.5">Invest by Category</h2>
        <div class="grid grid-cols-4 gap-2.5">
          <!-- Category 1: Duration -->
          <button
            class="bg-white p-2.5 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center hover:border-emerald-200 transition"
            type="button">
            <div class="w-9 h-9 rounded-xl bg-blue-50 flex items-center justify-center mb-1.5 text-blue-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
                <circle cx="12" cy="12" r="8"></circle>
                <path d="M12 8v4l2.5 2.5" stroke-linecap="round"></path>
              </svg>
            </div>
            <span class="text-[11px] font-semibold text-slate-700">Duration</span>
          </button>
          <!-- Category 2: Return -->
          <button
            class="bg-white p-2.5 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center hover:border-emerald-200 transition"
            type="button">
            <div class="w-9 h-9 rounded-xl bg-emerald-50 flex items-center justify-center mb-1.5 text-emerald-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
                <path
                  d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V6m0 8c-1.11 0-2.08-.402-2.599-1M12 16v2m7-9l-3-3m0 0l-3 3m3-3v8"
                  stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </div>
            <span class="text-[11px] font-semibold text-slate-700">Return</span>
          </button>
          <!-- Category 3: Low Risk -->
          <button
            class="bg-white p-2.5 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center hover:border-emerald-200 transition"
            type="button">
            <div class="w-9 h-9 rounded-xl bg-amber-50 flex items-center justify-center mb-1.5 text-amber-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
                <path d="M3 6l9-4 9 4v6c0 5-4 9-9 10A12 12 0 013 12V6z" stroke-linecap="round" stroke-linejoin="round">
                </path>
                <path d="M9 12h6m-3-3v6" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </div>
            <span class="text-[11px] font-semibold text-slate-700 whitespace-nowrap">Low Risk</span>
          </button>
          <!-- Category 4: Safety -->
          <button
            class="bg-white p-2.5 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center hover:border-emerald-200 transition"
            type="button">
            <div class="w-9 h-9 rounded-xl bg-emerald-50 flex items-center justify-center mb-1.5 text-emerald-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
                <path
                  d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
                  stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </div>
            <span class="text-[11px] font-semibold text-slate-700">Safety</span>
          </button>
        </div>
      </section>
      <!-- END: InvestByCategory -->
      <!-- BEGIN: BestOffers -->
      <section class="mt-4 px-4 pb-4" data-purpose="offers-section">
        <div class="flex items-center justify-between mb-2.5">
          <h2 class="text-sm font-bold text-slate-900">Best Offers</h2>
          <a class="text-xs font-semibold text-forest hover:underline" href="#">View all</a>
        </div>
        <div class="flex space-x-3 overflow-x-auto no-scrollbar pb-1">
          <!-- Offer Card 1: Lush Crop Field -->
          <div
            class="min-w-[160px] w-44 rounded-2xl overflow-hidden bg-white border border-slate-100 shadow-sm shrink-0">
            <div class="h-24 w-full overflow-hidden">
              <img alt="Green Crop Farm" class="w-full h-full object-cover"
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuAirGtGeAEFEA4McgNX3Ld_N1w3awIuajEGCSbwy_zt7ixY45El04lXI3i4aqQPSD1uYmlT3lvWdZPPKLH69SPMV2MqGQzHCXX4jAUVuLOMKcZAod3FFuD8xQ8oFhfUAzKBRA51r3Oe2MTUL61Huw2efHRGfkfyIBJSdZtsfBZ_q63Qqk7mOJIj6vZxe2ArFsLe5tjh0d4IYCxM3tVnKxnr8Sm9Z8IWSeMFSAXX7Rwc" />
            </div>
            <div class="p-2.5">
              <p class="text-xs font-bold text-slate-900 truncate">Organic Vineyard</p>
              <div class="flex items-center justify-between mt-1 text-[11px]">
                <span class="text-slate-400">ROI:</span>
                <span class="font-bold text-emerald-600">14.8% / yr</span>
              </div>
            </div>
          </div>
          <!-- Offer Card 2: Golden Wheat Field -->
          <div
            class="min-w-[160px] w-44 rounded-2xl overflow-hidden bg-white border border-slate-100 shadow-sm shrink-0">
            <div class="h-24 w-full overflow-hidden">
              <img alt="Golden Wheat Farm" class="w-full h-full object-cover"
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuBA_fj8KnbmhOvIEubCWRJXKjALqiFHViKZUA7vlqaDzHhtylZmwghckqgCE_Pmg7w2ztsE38HJQze9gYyI-2EKEApDgjwEbsyGtSWH2nGu6nfVNhYqOlt0ll6LQz4Ib9IRCNXePBs_GIpFT4QizGL71lxWRXv77BzZ3-rlgHeLOf6P3QrlJh_M9fbINtEzsIaaKRtKAXJ0py3Lu353m8ZZpP5-ePNDtX2SCJ6vtYuo" />
            </div>
            <div class="p-2.5">
              <p class="text-xs font-bold text-slate-900 truncate">Wheat Plantation</p>
              <div class="flex items-center justify-between mt-1 text-[11px]">
                <span class="text-slate-400">ROI:</span>
                <span class="font-bold text-emerald-600">12.5% / yr</span>
              </div>
            </div>
          </div>
        </div>
      </section>
      <!-- END: BestOffers -->
    </div>
    <!-- BEGIN: BottomNavigation -->
    <nav class="absolute bottom-0 inset-x-0 bg-white border-t border-slate-100 shadow-nav px-5 py-2 z-30"
      data-purpose="bottom-nav">
      <div class="flex justify-between items-center text-[10px] font-medium">
        <!-- Tab 1: Home (Active) -->
        <button class="flex flex-col items-center text-forest group" type="button">
          <div class="p-1 rounded-full group-hover:scale-105 transition">
            <svg class="w-5 h-5 fill-current" viewbox="0 0 20 20">
              <path
                d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z">
              </path>
            </svg>
          </div>
          <span class="font-bold">Home</span>
        </button>
        <!-- Tab 2: All Farms -->
        <button class="flex flex-col items-center text-slate-400 hover:text-forest transition" type="button">
          <div class="p-1">
            <svg class="w-5 h-5 fill-none stroke-current" stroke-width="1.8" viewbox="0 0 24 24">
              <path d="M12 3v18m0-18C8 3 5 7 5 11c0 5 7 7 7 7s7-2 7-7c0-4-3-8-7-8z" stroke-linecap="round"
                stroke-linejoin="round"></path>
            </svg>
          </div>
          <span>All Farms</span>
        </button>
        <!-- Tab 3: Statistic -->
        <button class="flex flex-col items-center text-slate-400 hover:text-forest transition" type="button">
          <div class="p-1">
            <svg class="w-5 h-5 fill-none stroke-current" stroke-width="1.8" viewbox="0 0 24 24">
              <path d="M4 19h16M7 16V9m5 7v-5m5 5V6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </div>
          <span>Statistic</span>
        </button>
        <!-- Tab 4: My Profile -->
        <button class="flex flex-col items-center text-slate-400 hover:text-forest transition" type="button">
          <div class="p-1">
            <svg class="w-5 h-5 fill-none stroke-current" stroke-width="1.8" viewbox="0 0 24 24">
              <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round"
                stroke-linejoin="round"></path>
            </svg>
          </div>
          <span>My Profile</span>
        </button>
      </div>
      <!-- iOS Home Indicator Pill -->
      <div class="w-32 h-1 bg-slate-900 rounded-full mx-auto mt-2 mb-0.5"></div>
    </nav>
    <!-- END: BottomNavigation -->
  </main>
  <!-- END: MobileFrame -->
</body>

</html>
