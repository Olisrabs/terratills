# Netlify Configuration for TerraTills (React 19 + Vite SPA)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# Security & performance headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache immutable hashed assets for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ensure index.html is never cached so new deploys are immediately visible
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Optional backend API proxy:
# If you run your Express backend on a separate host (e.g. Render, Railway, Fly.io, VPS),
# you can route all /api/* requests directly through Netlify without CORS issues:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-api-domain.com/api/:splat"
#   status = 200
#   force = true

# SPA client-side routing fallback:
# Any path that is not an existing static file rewrites to index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
